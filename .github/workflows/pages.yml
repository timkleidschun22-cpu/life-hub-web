name: Persist and Deploy Life Hub Web

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/pages.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v4

      - name: Download verified Life Hub web artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site-next
          mkdir -p site-next
          curl --fail --location --retry 3 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-09c8-8206-99a3-587530a46868/raw?se=2026-09-30T00%3A06%3A39Z&sp=r&sv=2026-02-06&sr=b&scid=2b21b441-7666-5665-a02f-84736eefa87c&skoid=1e4bb9ed-6bb5-424a-a3aa-79f21566e722&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T21%3A47%3A00Z&ske=2026-09-30T21%3A47%3A00Z&sks=b&skv=2026-02-06&sig=Udn%2BQe2YMs7o/KcE%2BC1RepDFYhTkYpSIcP6uL3bfPUY%3D' -o /tmp/life-hub-web.zip
          unzip -q /tmp/life-hub-web.zip -d site-next

      - name: Verify goal-workflow site
        shell: bash
        run: |
          set -euo pipefail
          test -f site-next/index.html
          test -f site-next/manifest.json
          test -n "$(find site-next/_expo/static/js/web -name 'AppEntry-*.js' -print -quit)"
          grep -q '/life-hub-web/_expo/' site-next/index.html
          grep -R -q 'Vorhaben starten' site-next/_expo/static/js/web
          grep -R -q 'GOALS & PROJECTS' site-next/_expo/static/js/web
          grep -R -q 'msbukmpggridfnpovrxw.supabase.co' site-next/_expo/static/js/web
          touch site-next/.nojekyll
          printf 'User-agent: *\nDisallow: /\n' > site-next/robots.txt

      - name: Persist public build in repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mv site-next site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site
          if git diff --cached --quiet; then
            echo "Public site already matches artifact."
          else
            git commit -m "Update Life Hub goal workflow site"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
