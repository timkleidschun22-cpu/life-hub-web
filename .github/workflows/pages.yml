name: Deploy Life Hub Web

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify persisted Life Hub site
        shell: bash
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/manifest.json
          test -f site/life-hub-192.png
          test -f site/life-hub-512.png
          test -f site/.nojekyll
          test -n "$(find site/_expo/static/js/web -name 'AppEntry-*.js' -print -quit)"
          grep -q '/life-hub-web/_expo/' site/index.html
          grep -q 'noindex,nofollow,noarchive' site/index.html
          grep -R -q 'msbukmpggridfnpovrxw.supabase.co' site/_expo/static/js/web
          grep -R -q 'OBSIDIAN PROJECTION' site/_expo/static/js/web
          grep -R -q 'Recherche offen' site/_expo/static/js/web

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
