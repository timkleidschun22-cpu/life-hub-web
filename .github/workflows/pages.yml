name: Persist and Deploy Life Hub Web

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/pages.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v4

      - name: Download verified Life Hub web artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site-next
          mkdir -p site-next
          curl --fail --location --retry 3 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-367c-820b-b95d-c2a42330683c/raw?se=2026-09-30T03%3A37%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=662ecd37-efbb-582f-bd74-fd9c7efd0241&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-30T02%3A54%3A29Z&ske=2026-10-01T02%3A54%3A29Z&sks=b&skv=2026-02-06&sig=GVghNF8uBphKT/A85C/L3nGhh0YGs0K42a64Ui0VyLQ%3D' -o /tmp/life-hub-web.zip
          unzip -q /tmp/life-hub-web.zip -d site-next

      - name: Verify and prepare site
        shell: bash
        run: |
          set -euo pipefail
          test -f site-next/index.html
          test -f site-next/manifest.json
          test -n "$(find site-next/_expo/static/js/web -name 'AppEntry-*.js' -print -quit)"
          grep -q '/life-hub-web/_expo/' site-next/index.html
          grep -q 'noindex,nofollow,noarchive' site-next/index.html
          grep -R -q 'msbukmpggridfnpovrxw.supabase.co' site-next/_expo/static/js/web
          grep -R -q 'OBSIDIAN PROJECTION' site-next/_expo/static/js/web
          grep -R -q 'Recherche offen' site-next/_expo/static/js/web
          touch site-next/.nojekyll
          printf 'User-agent: *\nDisallow: /\n' > site-next/robots.txt

      - name: Persist public build in repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mv site-next site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site
          if git diff --cached --quiet; then
            echo "Public site already matches artifact."
          else
            git commit -m "Update deployed Life Hub site"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
