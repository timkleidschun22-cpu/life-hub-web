name: Persist and Deploy Life Hub Web

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/pages.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v4

      - name: Download verified Life Hub web artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site-next
          mkdir -p site-next
          curl --fail --location --retry 3 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-e510-8206-be90-7d126ea4774e/raw?se=2026-09-29T22%3A26%3A57Z&sp=r&sv=2026-02-06&sr=b&scid=663e8475-56e3-5646-a722-e2ae4fc46c47&skoid=1e4bb9ed-6bb5-424a-a3aa-79f21566e722&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T20%3A32%3A31Z&ske=2026-09-30T20%3A32%3A31Z&sks=b&skv=2026-02-06&sig=687rOccbjt%2BpXSL%2BA8nATdmpK/IaZbYD68hjttGIb/8%3D' -o /tmp/life-hub-web.zip
          unzip -q /tmp/life-hub-web.zip -d site-next

      - name: Verify and prepare site
        shell: bash
        run: |
          set -euo pipefail
          test -f site-next/index.html
          test -f site-next/manifest.json
          test -n "$(find site-next/_expo/static/js/web -name 'AppEntry-*.js' -print -quit)"
          grep -q '/life-hub-web/_expo/' site-next/index.html
          grep -q 'noindex,nofollow,noarchive' site-next/index.html
          grep -R -q 'msbukmpggridfnpovrxw.supabase.co' site-next/_expo/static/js/web
          grep -R -q 'Supabase verbunden' site-next/_expo/static/js/web
          touch site-next/.nojekyll
          printf 'User-agent: *\nDisallow: /\n' > site-next/robots.txt
          cat > site-next/sw.js <<'EOF'
          self.addEventListener('install', () => self.skipWaiting());
          self.addEventListener('activate', event => {
            event.waitUntil((async () => {
              const keys = await caches.keys();
              await Promise.all(keys.map(key => caches.delete(key)));
              await self.registration.unregister();
              const clientsList = await self.clients.matchAll({ type: 'window' });
              for (const client of clientsList) client.navigate(client.url);
            })());
          });
          EOF
          python <<'PY'
          from pathlib import Path
          p = Path('site-next/index.html')
          html = p.read_text()
          cleanup = """<script>
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
          }
          if ('caches' in window) {
            caches.keys().then(keys => Promise.all(keys.map(k => caches.delete(k))));
          }
          </script>"""
          html = html.replace('</body>', cleanup + '\n</body>')
          p.write_text(html)
          PY

      - name: Persist public build in repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mv site-next site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site
          if git diff --cached --quiet; then
            echo "Public site already matches artifact."
          else
            git commit -m "Update deployed Life Hub site"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
