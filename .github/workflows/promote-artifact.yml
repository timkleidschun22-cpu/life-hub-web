name: Promote verified Life Hub artifact

on:
  push:
    branches: [ main ]
    paths:
      - 'release-source.json'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  promote:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout public release repository
        uses: actions/checkout@v4

      - name: Validate release handoff
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from urllib.parse import urlparse

          with open('release-source.json', 'r', encoding='utf-8') as f:
              source = json.load(f)

          required = ['artifactUrl', 'version', 'sourceCommit', 'webBuild', 'validatedSourceCommit', 'androidBuild', 'expiresAt']
          missing = [key for key in required if not source.get(key)]
          if missing:
              raise SystemExit(f"Missing release-source fields: {', '.join(missing)}")

          parsed = urlparse(source['artifactUrl'])
          host = (parsed.hostname or '').lower()
          if parsed.scheme != 'https' or not host.endswith('.oaiusercontent.com'):
              raise SystemExit('artifactUrl must be an HTTPS OpenAI file handoff URL')

          expires = datetime.fromisoformat(source['expiresAt'].replace('Z', '+00:00'))
          if expires <= datetime.now(timezone.utc):
              raise SystemExit('artifactUrl has already expired')

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f"ARTIFACT_URL={source['artifactUrl']}\n")
          PY

      - name: Download verified static artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "$ARTIFACT_URL" --output artifact.zip

      - name: Safely extract artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf staging
          mkdir staging
          python <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          root_files = {
              'index.html',
              'manifest.json',
              'metadata.json',
              'life-hub-192.png',
              'life-hub-512.png',
              'sw.js',
          }

          with ZipFile('artifact.zip') as zf:
              for info in zf.infolist():
                  path = Path(info.filename)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'Unsafe ZIP path: {info.filename}')
                  if info.is_dir():
                      continue
                  allowed = info.filename in root_files or (path.parts and path.parts[0] == '_expo')
                  if not allowed:
                      raise SystemExit(f'Unexpected artifact file: {info.filename}')
              zf.extractall('staging')
          PY

      - name: Verify Life Hub public build
        shell: bash
        run: |
          set -euo pipefail
          test -f staging/index.html
          test -f staging/manifest.json
          test -f staging/metadata.json
          test -f staging/life-hub-192.png
          test -f staging/life-hub-512.png
          test -f staging/sw.js
          BUNDLE="$(find staging/_expo/static/js/web -maxdepth 1 -type f -name 'AppEntry-*.js' -print)"
          test "$(printf '%s\n' "$BUNDLE" | sed '/^$/d' | wc -l)" -eq 1
          grep -q '/life-hub-web/_expo/' staging/index.html
          grep -q 'noindex,nofollow,noarchive' staging/index.html
          grep -q '"display": "standalone"' staging/manifest.json
          grep -q "navigator.serviceWorker.register('./sw.js')" staging/index.html
          grep -q 'life-hub-web-shell-' staging/sw.js
          grep -q 'msbukmpggridfnpovrxw.supabase.co' "$BUNDLE"
          grep -q 'Vorhaben starten' "$BUNDLE"
          grep -Fq 'What matters now' "$BUNDLE"
          grep -q 'Was ist Life Hub?' "$BUNDLE"
          grep -Fq 'Requirements & personal gaps' "$BUNDLE"
          grep -Fq 'life-hub-legacy-pre-reset-recovery-only' "$BUNDLE"
          grep -Fq 'life-hub-obsidian-' "$BUNDLE"
          grep -Fq 'x-life-hub-reset-epoch' "$BUNDLE"
          grep -Fq 'learning.session.recorded' "$BUNDLE"

      - name: Persist verified site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          cp -a staging/. site/
          touch site/.nojekyll
          printf 'User-agent: *\nDisallow: /\n' > site/robots.txt
          python <<'PY'
          import json

          with open('release-source.json', 'r', encoding='utf-8') as f:
              source = json.load(f)

          release = {
              'version': source['version'],
              'sourceCommit': source['sourceCommit'],
              'webBuild': source['webBuild'],
              'validatedSourceCommit': source['validatedSourceCommit'],
              'androidBuild': source['androidBuild'],
          }

          with open('site/release.json', 'w', encoding='utf-8') as f:
              json.dump(release, f, indent=2)
              f.write('\n')
          PY

      - name: Prepare verified site for Pages
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c "import json; print(json.load(open('release-source.json'))['version'])")"
          echo "Verified Life Hub ${VERSION} is ready for direct Pages deployment."
          echo "Repository persistence is intentionally skipped because this repository's GITHUB_TOKEN is read-only."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed Pages release
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          VERSION="$(python -c "import json; print(json.load(open('release-source.json'))['version'])")"
          LIVE_INDEX="$(mktemp)"
          LIVE_BUNDLE="$(mktemp)"

          for attempt in $(seq 1 12); do
            CACHE_BUST="?lifehub_verify=${GITHUB_SHA}_${attempt}"
            if curl --fail --silent --show-error --location               --header 'Cache-Control: no-cache'               "${PAGE_URL}${CACHE_BUST}"               --output "$LIVE_INDEX"; then
              BUNDLE_PATH="$(python - "$LIVE_INDEX" <<'PY'
          import re
          import sys

          html = open(sys.argv[1], 'r', encoding='utf-8').read()
          match = re.search(r'<script[^>]+src="([^"]*AppEntry-[^"]+\.js)"', html)
          print(match.group(1) if match else '')
          PY
              )"

              if [ -n "$BUNDLE_PATH" ]; then
                BUNDLE_URL="$(python - "$PAGE_URL" "$BUNDLE_PATH" <<'PY'
          import sys
          from urllib.parse import urljoin

          print(urljoin(sys.argv[1], sys.argv[2]))
          PY
                )"

                if curl --fail --silent --show-error --location                   --header 'Cache-Control: no-cache'                   "$BUNDLE_URL"                   --output "$LIVE_BUNDLE"                   && grep -Fq "${VERSION}" "$LIVE_BUNDLE"; then
                  echo "Verified deployed Life Hub ${VERSION} at ${PAGE_URL}"
                  exit 0
                fi
              fi
            fi

            sleep 5
          done

          echo "Deployed Pages release did not match Life Hub ${VERSION} after retries." >&2
          exit 1
