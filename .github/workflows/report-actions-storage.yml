name: Report Actions storage

on:
  push:
    branches:
      - chore/report-actions-storage

permissions:
  actions: read
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report artifacts and caches
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            );
            const artifactBytes = artifacts.reduce((sum, x) => sum + Number(x.size_in_bytes || 0), 0);
            core.info(`ARTIFACT_SUMMARY count=${artifacts.length} sizeMiB=${(artifactBytes/1024/1024).toFixed(1)}`);
            const groups = new Map();
            for (const a of artifacts) {
              const key = a.name || '(unnamed)';
              const row = groups.get(key) || { count: 0, bytes: 0 };
              row.count += 1;
              row.bytes += Number(a.size_in_bytes || 0);
              groups.set(key, row);
            }
            for (const [name, row] of [...groups.entries()].sort((a,b)=>b[1].bytes-a[1].bytes)) {
              core.info(`ARTIFACT_GROUP name=${name} count=${row.count} sizeMiB=${(row.bytes/1024/1024).toFixed(1)}`);
            }

            const caches = [];
            for (let page=1;;page+=1) {
              const response = await github.request('GET /repos/{owner}/{repo}/actions/caches', {
                owner, repo, per_page: 100, page
              });
              const batch = response.data.actions_caches || [];
              caches.push(...batch);
              if (batch.length < 100) break;
            }
            const cacheBytes = caches.reduce((sum, x) => sum + Number(x.size_in_bytes || 0), 0);
            core.info(`CACHE_SUMMARY count=${caches.length} sizeMiB=${(cacheBytes/1024/1024).toFixed(1)}`);
